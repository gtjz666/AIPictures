[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aipictures-sprite-pipeline"
version = "0.1.0"
description = "Deterministic discrete PNG sprite asset processing"
requires-python = ">=3.10"
dependencies = ["Pillow>=11,<13", "numpy>=2.0,<3", "PyYAML>=6.0.3,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
sprite_pipeline = "sprite_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["sprite_pipeline*"]
